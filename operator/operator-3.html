<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>증가 감소 연산자</title>
  </head>

  <body>
    <h2 id="counter">클릭 횟수 : 0</h2>
    <button class="indcrease">증가(+)</button>
    <button class="decrease">감소(-)</button>  
    <!-- id나 class 둘중 아무구나해두댐 -->

    <script>
      let counter = document.querySelector("#counter"); //id는 #으로 찾아야함 .으로 하면 못찾음 ㅠ
      // console.log(counter); 젤찾는거 확인햇고  
      let indc = document.querySelector(".indcrease"); // class라 .으로 찾을수잇음
      //   console.log(ind);
      let dec = document.querySelector(".decrease");
      //기본값설정
      let count = 0;

      //   증가 함수
      indc.addEventListener("click", function () {
        // console.log("click");
        count++;
        // console.log(count);
        counter.textContent = `클릭 횟수 : ${count}`;
      });

      dec.addEventListener("click",function(){
        // console.log("click"); 
        count --;
        // console.log(count);
        counter.textContent = `클릭 횟수 : ${count}`;


      })
      // 감소 함수
    </script>
  </body>
</html>
