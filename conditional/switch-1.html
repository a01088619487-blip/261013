<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>swich문법</title>
  </head>
  <body>
    <script>
      //   switch (조건) {
      //       case 값1: 명령 1;   값이 맞으면 명령 1행동

      //           break;
      //       case 값2: 명령 2;   값이 맞으면 명령 2행동

      //           break;
      //       case 값3: 명령 3;   값이 맞으면 명령 3행동

      //             break;
      //             -----
      //       default:명령 n
      //           break;
      //   }  <요게 기본 문법

      let score = prompt("점수를 입력하세요", ""); // 뒤에 ""는 입력창에 글이나옴 ""빈공간이면 지워도 됨 ㅇㅇ
      // let score = prompt("점수를 입력하세요" ,"90")
      console.log(score);
      // 변수 선언만 한상태
      let grade;
      switch (true) {
        // switch는 true false 중에 들어간다
        case score >= 90:
          // 90보다 같으면 어쩔겨
          grade = "A학점";
          break;

          case score >= 80:
          grade = "B학점";
          break;

           case score >= 70:
          grade = "C학점";
          break;

          case score >= 60:
          grade = "D학점";
          break;

          default:
          grade = "F학점";
          break;

      }
      document.write(`당신의 학점은 : ${grade}`)
    </script>
  </body>
</html>
