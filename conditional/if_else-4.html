<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인상태변경</title>
  </head>
  <body>
    <!-- 로그인 상태 변경 -->
    <button id="loginBtn">로그인</button>
    <p id="text">로그아웃 상태</p>
    <!-- 쫗아용 버튼 -->
    <button id="likeBtn">🤍</button>
    <script>
      //로그인 상태 변경
      const btn = document.querySelector("#loginBtn");
      // console.log(btn);
      const text = document.querySelector("#text");
      //   console.log(text);
      //로그인 상태
      let isLogin = false;
      //로그인 창을 눌럿을때의 조건

      //   로그인 상태 변경 함수
      btn.addEventListener("click", function () {
        // console.log("click");
        if (isLogin) {
          //로그인 상태 -> 로그아웃으로 바꾸겟다
          isLogin = false;
          text.textContent = "로그아웃 상태";
          btn.textContent = "로그인";
        } else {
          //로그아웃 상태를 로그인으로 바꿀려고
          isLogin = true;
          text.textContent = "로그인 상태";
          btn.textContent = "로그아웃 상태";
        }
      });
      //   좋아요 버튼
      const likeBtn = document.querySelector("#likeBtn");
        let isLike = false;
      //   likeBtn.addEventListener("click" function(){}) 펀션이벤트도 귀찮아서 화살표함수로 사용가능
      likeBtn.addEventListener("click", () => {
        isLike = !isLike 
        // 상태 토글 클릭시 왓다갓다 true false 왓다갓다
        // console.log(isLike);
    if (isLike) {
        likeBtn.textContent = "🩷"        
    }else{
         likeBtn.textContent = "🤍"    
    }
        
      });
      
    </script>
  </body>
</html>
